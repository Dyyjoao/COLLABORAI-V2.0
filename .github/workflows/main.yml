name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Encontrar pasta raiz do projeto Android
        id: find_project
        run: |
          APP_BUILD=$(find . -path "*/app/build.gradle.kts" | head -1)
          echo "Encontrado: $APP_BUILD"
          PROJECT=$(dirname "$(dirname "$APP_BUILD")")
          echo "Raiz: $PROJECT"
          echo "project_dir=$PROJECT" >> $GITHUB_OUTPUT

      - name: Build APK Debug
        run: |
          cd "${{ steps.find_project.outputs.project_dir }}"
          echo "Buildando em: $(pwd)"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CollaboraAI-debug
          path: "**/*.apk"
          retention-days: 30
