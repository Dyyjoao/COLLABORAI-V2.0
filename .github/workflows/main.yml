package com.collaborai.app

import android.Manifest
import android.content.Intent
import android.content.pm.PackageManager
import android.net.ConnectivityManager
import android.net.NetworkCapabilities
import android.os.Bundle
import android.view.KeyEvent
import android.view.View
import android.webkit.WebChromeClient
import android.webkit.WebResourceError
import android.webkit.WebResourceRequest
import android.webkit.WebSettings
import android.webkit.WebView
import android.webkit.WebViewClient
import android.widget.ProgressBar
import android.widget.TextView
import androidx.appcompat.app.AppCompatActivity
import androidx.core.app.ActivityCompat
import androidx.core.content.ContextCompat
import com.google.android.material.floatingactionbutton.FloatingActionButton

class MainActivity : AppCompatActivity() {

    companion object {
        private const val COLLABORAAI_URL = "https://app.collaborai.io/"
        private const val PERMISSION_REQUEST_CODE = 100
    }

    private lateinit var webView: WebView
    private lateinit var progressBar: ProgressBar
    private lateinit var errorView: TextView
    private lateinit var fab: FloatingActionButton

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_main)

        progressBar = findViewById(R.id.progressBar)
        errorView   = findViewById(R.id.errorView)
        fab         = findViewById(R.id.fab)
        webView     = findViewById(R.id.webView)

        setupWebView()
        setupFab()
        requestPermissions()

        if (isConnected()) {
            loadUrl()
        } else {
            showError("Sem conexão com a internet.\nVerifique sua rede e tente novamente.")
        }
    }

    // ─── WebView ──────────────────────────────────────────────────────────────

    private fun setupWebView() {
        webView.settings.apply {
            javaScriptEnabled          = true
            domStorageEnabled          = true
            loadWithOverviewMode       = true
            useWideViewPort            = true
            setSupportZoom(true)
            builtInZoomControls        = true
            displayZoomControls        = false
            cacheMode                  = WebSettings.LOAD_DEFAULT
            mediaPlaybackRequiresUserGesture = false
            mixedContentMode           = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
        }

        webView.webChromeClient = object : WebChromeClient() {
            override fun onProgressChanged(view: WebView?, newProgress: Int) {
                progressBar.progress = newProgress
                progressBar.visibility = if (newProgress < 100) View.VISIBLE else View.GONE
            }
        }

        webView.webViewClient = object : WebViewClient() {
            override fun onPageFinished(view: WebView?, url: String?) {
                progressBar.visibility = View.GONE
                errorView.visibility   = View.GONE
                webView.visibility     = View.VISIBLE
            }

            override fun onReceivedError(
                view: WebView?,
                request: WebResourceRequest?,
                error: WebResourceError?
            ) {
                if (request?.isForMainFrame == true) {
                    showError("Erro ao carregar a página.\nCódigo: ${error?.errorCode}")
                }
            }

            // Garante que links abram dentro do WebView
            override fun shouldOverrideUrlLoading(
                view: WebView?,
                request: WebResourceRequest?
            ): Boolean {
                val url = request?.url?.toString() ?: return false
                return if (url.startsWith("http://") || url.startsWith("https://")) {
                    view?.loadUrl(url)
                    true
                } else {
                    false
                }
            }
        }
    }

    private fun loadUrl() {
        webView.visibility   = View.VISIBLE
        errorView.visibility = View.GONE
        webView.loadUrl(COLLABORAAI_URL)
    }

    private fun showError(message: String) {
        webView.visibility   = View.GONE
        errorView.visibility = View.VISIBLE
        errorView.text       = message
    }

    // ─── FAB → AssistantActivity ──────────────────────────────────────────────

    private fun setupFab() {
        fab.setOnClickListener {
            startActivity(Intent(this, AssistantActivity::class.java))
        }
    }

    // ─── Conectividade ────────────────────────────────────────────────────────

    private fun isConnected(): Boolean {
        val cm = getSystemService(CONNECTIVITY_SERVICE) as ConnectivityManager
        val network = cm.activeNetwork ?: return false
        val caps    = cm.getNetworkCapabilities(network) ?: return false
        return caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
    }

    // ─── Permissões (microfone) ───────────────────────────────────────────────

    private fun requestPermissions() {
        val permissions = arrayOf(
            Manifest.permission.RECORD_AUDIO,
            Manifest.permission.INTERNET
        )
        val denied = permissions.filter {
            ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
        }
        if (denied.isNotEmpty()) {
            ActivityCompat.requestPermissions(this, denied.toTypedArray(), PERMISSION_REQUEST_CODE)
        }
    }

    // ─── Botão Voltar navega no WebView ───────────────────────────────────────

    override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
        if (keyCode == KeyEvent.KEYCODE_BACK && webView.canGoBack()) {
            webView.goBack()
            return true
        }
        return super.onKeyDown(keyCode, event)
    }

    // ─── Salva/restaura estado do WebView ────────────────────────────────────

    override fun onSaveInstanceState(outState: Bundle) {
        super.onSaveInstanceState(outState)
        webView.saveState(outState)
    }

    override fun onRestoreInstanceState(savedInstanceState: Bundle) {
        super.onRestoreInstanceState(savedInstanceState)
        webView.restoreState(savedInstanceState)
    }
}
