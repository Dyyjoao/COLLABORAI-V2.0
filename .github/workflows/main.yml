name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Encontrar e executar gradlew
        run: |
          GRADLEW=$(find . -name "gradlew" | head -1)
          echo "Encontrado: $GRADLEW"
          chmod +x "$GRADLEW"
          DIR=$(dirname "$GRADLEW")
          cd "$DIR" && ./gradlew assembleDebug

      - name: Encontrar APK gerado
        run: find . -name "*.apk" -type f

      - uses: actions/upload-artifact@v4
        with:
          name: CollaboraAI-debug
          path: "**/*.apk"
          retention-days: 30
