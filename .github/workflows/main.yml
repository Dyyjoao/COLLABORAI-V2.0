name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Encontrar projeto
        id: find_project
        run: |
          APP_BUILD=$(find . -path "*/app/build.gradle.kts" | head -1)
          PROJECT=$(dirname "$(dirname "$APP_BUILD")")
          echo "project_dir=$PROJECT" >> $GITHUB_OUTPUT

      - name: Criar gradle.properties
        run: |
          cd "${{ steps.find_project.outputs.project_dir }}"
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=35" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties

      - name: Gerar icones do app
        run: |
          sudo apt-get install -y imagemagick -q
          RES="${{ steps.find_project.outputs.project_dir }}/app/src/main/res"
          for DENSITY in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$RES/$DENSITY"
            case $DENSITY in
              mipmap-mdpi)    SIZE=48  ;;
              mipmap-hdpi)    SIZE=72  ;;
              mipmap-xhdpi)   SIZE=96  ;;
              mipmap-xxhdpi)  SIZE=144 ;;
              mipmap-xxxhdpi) SIZE=192 ;;
            esac
            convert -size ${SIZE}x${SIZE} xc:#2563EB "$RES/$DENSITY/ic_launcher.png"
            convert -size ${SIZE}x${SIZE} xc:#2563EB "$RES/$DENSITY/ic_launcher_round.png"
          done

      - name: Build APK Debug
        run: |
          cd "${{ steps.find_project.outputs.project_dir }}"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CollaboraAI-debug
          path: "**/*.apk"
          retention-days: 30
